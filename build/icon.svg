<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#262a33" />
            <stop offset="1" stop-color="#14161b" />
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffd875" />
            <stop offset="1" stop-color="#e0a52f" />
        </linearGradient>
        <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6ea2f0" />
            <stop offset="1" stop-color="#2b5ea8" />
        </linearGradient>
    </defs>

    <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" />

    <!-- Deck list rows -->
    <rect x="112" y="150" width="288" height="52" rx="12" fill="url(#gold)" />
    <rect x="112" y="230" width="288" height="52" rx="12" fill="url(#gold)" opacity="0.75" />
    <rect x="112" y="310" width="288" height="52" rx="12" fill="url(#gold)" opacity="0.4" />

    <!-- Mana gems -->
    <path d="M150 150 l20 26 -20 26 -20 -26z" fill="url(#gem)" stroke="#14161b" stroke-width="6" />
    <path d="M150 230 l20 26 -20 26 -20 -26z" fill="url(#gem)" stroke="#14161b" stroke-width="6" />
    <path d="M150 310 l20 26 -20 26 -20 -26z" fill="url(#gem)" stroke="#14161b" stroke-width="6" opacity="0.6" />
</svg>
